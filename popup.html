<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  :root { --bg: #fff; --fg: #111; --muted: #888; --line: #e5e5e5; --hover: #f3f3f3; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #161616; --fg: #eee; --muted: #777; --line: #2a2a2a; --hover: #222; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; width: 240px; background: var(--bg); color: var(--fg); font: 13px/1.4 system-ui, sans-serif; }
  header, section { padding: 10px 12px; border-bottom: 1px solid var(--line); }
  header { font-weight: 600; }
  section:last-child { border-bottom: 0; }
  button { display: flex; justify-content: space-between; width: 100%; font: inherit; color: inherit; background: none; border: 0; border-radius: 6px; padding: 6px 8px; cursor: pointer; text-align: left; }
  button:hover { background: var(--hover); }
  kbd { font: inherit; color: var(--muted); }
  .muted { color: var(--muted); }
  #note { color: #e5261f; }
  #note:empty { display: none; }
</style>
</head>
<body>
  <header>Redpen</header>
  <section>
    <button data-cmd="underline"><span>Underline in red</span><kbd></kbd></button>
    <button data-cmd="circle"><span>Circle in red</span><kbd></kbd></button>
    <button data-cmd="blackout"><span>Black out</span><kbd></kbd></button>
  </section>
  <section>
    <button data-cmd="undo"><span>Undo last mark</span><kbd></kbd></button>
    <button data-cmd="clear"><span>Clear all marks</span></button>
  </section>
  <section>
    <div id="note"></div>
    <div class="muted">Select text first. Alt+click a mark to remove it, Alt+Shift+click to change its type.</div>
  </section>
  <script src="popup.js"></script>
</body>
</html>
