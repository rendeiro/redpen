<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  :root { --bg: #fff; --fg: #111; --muted: #888; --line: #e5e5e5; --hover: #f3f3f3; --on: #111; --on-fg: #fff; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #161616; --fg: #eee; --muted: #777; --line: #2a2a2a; --hover: #222; --on: #eee; --on-fg: #111; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; width: 250px; background: var(--bg); color: var(--fg); font: 13px/1.4 system-ui, sans-serif; }
  section { padding: 10px 12px; border-bottom: 1px solid var(--line); }
  section:last-child { border-bottom: 0; }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
  .tool { display: flex; align-items: center; gap: 10px; width: 100%; border-radius: 6px; padding: 6px 8px; text-align: left; }
  .tool:hover { background: var(--hover); }
  .tool[aria-pressed="true"] { background: var(--on); color: var(--on-fg); }
  .tool svg { width: 34px; height: 16px; flex: none; }
  .row { display: flex; align-items: center; justify-content: space-between; padding: 3px 8px; }
  .swatches { display: flex; gap: 6px; }
  .swatch { width: 18px; height: 18px; border-radius: 50%; padding: 0; border: 1px solid rgba(128, 128, 128, 0.5); }
  .swatch[aria-pressed="true"] { outline: 2px solid var(--fg); outline-offset: 2px; }
  .actions { display: flex; gap: 6px; }
  .actions button { flex: 1; border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; }
  .actions button:hover { background: var(--hover); }
  .muted { color: var(--muted); }
  #note { color: #e5261f; }
  #note:empty { display: none; }
  body.blocked button { opacity: 0.4; pointer-events: none; }
</style>
</head>
<body>
  <section id="tools">
    <button class="tool" data-tool="underline"><svg viewBox="0 0 34 16"><path class="pen" d="M3 11C10 9.5 22 12 31 10" fill="none" stroke-width="2.5" stroke-linecap="round"/></svg>Underline</button>
    <button class="tool" data-tool="circle"><svg viewBox="0 0 34 16"><ellipse class="pen" cx="17" cy="8" rx="13" ry="6" fill="none" stroke-width="2.2"/></svg>Circle</button>
    <button class="tool" data-tool="highlight"><svg viewBox="0 0 34 16"><rect class="hl" x="2" y="3" width="30" height="10" rx="2"/></svg>Highlight</button>
    <button class="tool" data-tool="blackout"><svg viewBox="0 0 34 16"><rect x="2" y="3" width="30" height="10" rx="1.5" fill="#000" stroke="#888" stroke-width="0.5"/></svg>Black out</button>
    <button class="tool" data-tool=""><svg viewBox="0 0 34 16"></svg>Off</button>
  </section>
  <section>
    <div class="row"><span>Pen</span><span class="swatches" id="pen"></span></div>
    <div class="row"><span>Highlighter</span><span class="swatches" id="hl"></span></div>
  </section>
  <section class="actions">
    <button id="undo">Undo last</button>
    <button id="clear">Clear all</button>
  </section>
  <section>
    <div id="note"></div>
    <div class="muted">Pick a tool, then select text: each selection is marked. Alt+click a mark to remove it.</div>
  </section>
  <script src="popup.js"></script>
</body>
</html>
